<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PersonalitySeek | Bootcamp II</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="btn-tema">🌙</button>

    <header class="index-header">
        <div class="header-textos">
            <h1>PersonalitySeek</h1>
            <p>Busque um perfil de personalidade</p>
        </div>
        <button id="botao-teste" onclick="window.location.href='teste.html'">
            ✨ Faça o Teste e Descubra sua Personalidade! ✨
        </button>
    </header>

    <main>
        <section class="busca">
            <input type="text" id="campo-busca" placeholder="Ex: INTJ, ENFP, ESTJ..." autofocus>
            <button id="botao-buscar">Buscar</button>
        </section>

        <section id="resultado"></section>

         <section class="favoritos">
            <h2>⭐ Meus favoritos <span id="contador-favoritos"></span></h2>
            <div id="lista-favoritos"></div>
        </section>

    <footer>Dados: Personality API (personality.fyi) · Projeto da Disciplina Bootcamp II</footer>

    <!--Conexão com o Supabase-->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
